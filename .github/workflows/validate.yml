#
# Applies the whole patch series against the pinned pristine FFmpeg release
# and fails on any offset or rejected hunk. Image publishing happens
# in the release pipeline not here

name: validate

on:
  push:
  pull_request:

jobs:
  patches-apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches against FFmpeg
        run: |
          . ./versions.env
          curl -fsSL -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          mkdir ffmpeg && tar -xf ffmpeg.tar.xz -C ffmpeg --strip-components=1
          cd ffmpeg
          fail=0
          while read -r p; do
            [ -n "$p" ] || continue
            out="$(patch -p1 --no-backup-if-mismatch < "../patches/$p" 2>&1)" || fail=1
            echo "$out"
            echo "$out" | grep -Eq 'fuzz|offset|FAILED|Reversed|malformed' && fail=1
          done < ../patches/series
          exit $fail

      - name: Shell syntax
        run: |
          for f in build*.sh common.sh; do bash -n "$f"; done
