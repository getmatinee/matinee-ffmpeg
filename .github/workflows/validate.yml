#
# Verifies the pinned source, applies the series with no offset or fuzz, then builds
# CPU and CUDA configurations and runs the regression and CPU smoke suites

name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mode: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm libx264-dev python3 clang git

      - name: Verify source, apply patches, build and run regressions
        run: bash ./validate.sh --${{ matrix.mode }}
