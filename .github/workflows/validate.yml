#
# Verifies the pinned source, applies the series with no offset or fuzz, then builds a
# CPU-only FFmpeg and runs the regression and smoke suites

name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CPU validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm libx264-dev python3

      - name: Verify source, apply patches, build and run regressions
        run: bash ./validate.sh --cpu
